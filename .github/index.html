name: Proof HTML

on:

    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    steps:
      - uses: actions/checkout@v4
      
      - name: Proof HTML
        uses: anishathalye/proof-html@v1.1.0
        with:
          directory: ./
          check_favicon: false
