name: Auto Assign
on:
  pull_request:
    branches:
      - main
    types: [opened]
  pull_request:
    types: [opened]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - name: 'Auto-assign issue'
      uses: pozil/auto-assign-issue@v1
      with:
          repo-token: 
          assignees: SkyMeilin
          numOfAssignee: 1
